services:
  bytebite:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bytebite
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
    volumes:
      - ./prisma/data:/app/prisma/data
